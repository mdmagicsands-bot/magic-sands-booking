<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register as a Partner | Magic Sands</title>
  <meta name="description" content="Register as a Magic Sands travel partner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="partner-login.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="https://www.magicsandsdmc.com/">
      <span class="logo-mark">MS</span>
      <span class="logo-text">
        <strong>Magic Sands</strong>
        <small>YOUR GUIDE TO ARABIA</small>
      </span>
    </a>
    <div class="header-actions">
      <a class="btn-outline" href="/partner-login/">Partner Login</a>
    </div>
  </header>

  <main class="portal">
    <header class="portal-intro">
      <h1>Register as a Partner</h1>
      <p>Submit your agency details. Our team will review and activate your B2B partner access.</p>
    </header>

    <div id="flash" class="flash" hidden></div>

    <section class="card register-card">
      <form id="register-form" class="login-form" method="post">
        <label>
          Company / Agency name
          <input type="text" name="company_name" required placeholder="Your travel agency">
        </label>
        <label>
          Contact person
          <input type="text" name="contact_name" required placeholder="Full name">
        </label>
        <label>
          Work email
          <input type="email" name="email" required placeholder="you@agency.com">
        </label>
        <label>
          Phone
          <input type="tel" name="phone" placeholder="+968 …">
        </label>
        <label>
          Country
          <input type="text" name="country" placeholder="Oman / UAE / …">
        </label>
        <label>
          Website
          <input type="url" name="website" placeholder="https://">
        </label>
        <label>
          Message
          <textarea name="message" rows="4" placeholder="Tell us about your agency and markets"></textarea>
        </label>
        <button type="submit" class="btn-primary">Submit registration</button>
      </form>
      <p class="register-note">Already registered? <a href="/partner-login/">Partner Login</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Registrations are stored in the Magic Sands Booking admin on Railway.</p>
  </footer>

  <script>
    (function () {
      var cfg = window.MAGIC_SANDS_CONFIG || {};
      var base = (cfg.BOOKING_APP_URL || "").replace(/\/$/, "");
      document.getElementById("register-form").action = base + "/gateway/partner-register/";

      var params = new URLSearchParams(window.location.search);
      var flash = document.getElementById("flash");
      if (params.get("ok") === "1") {
        flash.hidden = false;
        flash.className = "flash flash-ok";
        flash.textContent = "Thank you — your partner request was submitted. We will contact you shortly.";
      } else if (params.get("error") === "1") {
        flash.hidden = false;
        flash.className = "flash flash-error";
        flash.textContent = "Please complete company name, contact name, and email.";
      }
    })();
  </script>
</body>
</html>
