{% extends "marketing/base.html" %}
{% load static %}
{% block title %}{{ destination.name }} | {{ brand_full }}{% endblock %}

{% block content %}
<div class="Destii-innersec1">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-auto wow fadeInUp">
        <div class="Destii-innersec1-content">
          <div class="sec-title title-anim centered"><h2 class="sec-title_heading sec-colorr">{{ destination.name }}</h2></div>
          <p>{{ destination.teaser }}</p>
        </div>
      </div>
    </div>
    <div class="wow fadeInUp">
      <img src="{{ destination.detail_image|default:destination.image }}" alt="{{ destination.name }}" width="100%">
    </div>
  </div>
</div>

<div class="Destii-innersec2">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 wow fadeInUp">
        <div class="Destii-innersec2-content text-center">
          <p>{{ destination.summary }}</p>
          <p><a href="{% url 'destinations' %}">← All destinations</a> · <a href="{% url 'contact' %}">Plan with us</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
