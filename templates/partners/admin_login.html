{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Magic Sands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/partner.css' %}">
</head>
<body class="admin-login-page">
  <main class="admin-login-wrap">
    <form class="admin-login-box" method="post" action="{% url 'admin_login' %}">
      {% csrf_token %}
      <div class="admin-login-brand">
        <span class="pl-mark">MS</span>
        <div>
          <strong>Magic Sands</strong>
          <small>Admin</small>
        </div>
      </div>

      <h1>Sign in</h1>
      <p class="admin-login-sub">Use your admin username and password.</p>

      {% if messages %}
        {% for message in messages %}
        <div class="pl-alert pl-alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <label class="admin-field">
        Username
        <input type="text" name="username" required autocomplete="username" autofocus placeholder="admin">
      </label>
      <label class="admin-field">
        Password
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button type="submit" class="admin-login-btn">Login</button>
      <p class="admin-login-foot"><a href="{% url 'home' %}">← Back to site</a></p>
    </form>
  </main>
</body>
</html>
