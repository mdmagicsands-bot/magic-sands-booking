{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register as a Partner | Magic Sands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/partner-portal.css' %}">
</head>
<body>
  <main class="portal">
    <header class="portal-intro">
      <h1>Register as a Partner</h1>
      <p>Railway fallback form — production registration is on Hostinger.</p>
    </header>
    <section class="card" style="max-width:640px;margin:0 auto">
      <form class="login-form" method="post" action="{% url 'gateway_partner_register' %}">
        {% csrf_token %}
        <label>Company <input type="text" name="company_name" required></label>
        <label>Contact <input type="text" name="contact_name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Phone <input type="tel" name="phone"></label>
        <label>Country <input type="text" name="country"></label>
        <label>Website <input type="url" name="website"></label>
        <label>Message <textarea name="message" rows="4"></textarea></label>
        <button class="btn-primary" type="submit">Submit</button>
      </form>
    </section>
  </main>
</body>
</html>
