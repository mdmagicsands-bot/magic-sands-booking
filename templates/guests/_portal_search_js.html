<script>
(function () {
  const form = document.getElementById('guest-search-form');
  if (!form) return;

  const input = document.getElementById('destination');
  const placeId = document.getElementById('place_id');
  const hotelId = document.getElementById('hotel_id');
  const countryCode = document.getElementById('country_code');
  const box = document.getElementById('place-suggestions');
  const checkin = document.getElementById('checkin');
  const checkout = document.getElementById('checkout');
  const nights = document.getElementById('nights');
  const checkinDisplay = document.getElementById('checkin-display');
  const checkoutDisplay = document.getElementById('checkout-display');
  const adultsHidden = document.getElementById('adults');
  const roomsHidden = document.getElementById('rooms');
  const occupanciesHidden = document.getElementById('occupancies');
  const STORAGE_KEY = 'ms_partner_recent_searches';
  const NAT_KEY = 'ms_partner_recent_nationalities';
  const nationality = document.getElementById('nationality');
  const natChips = document.getElementById('nat-chips');
  const smartInput = document.getElementById('smart-search-input');
  const smartGo = document.getElementById('smart-search-go');
  let timer = null;
  let syncing = false;

  const NAT_DEFAULTS = [
    { code: 'IT', label: 'Italy' },
    { code: 'OM', label: 'Oman' },
    { code: 'DE', label: 'Germany' },
  ];

  function natLabel(code) {
    if (!nationality) return code;
    const opt = Array.from(nationality.options).find(function (o) { return o.value === code; });
    if (!opt) return code;
    return (opt.textContent || code).replace(/\s*\(.*\)\s*$/, '').trim() || code;
  }

  function loadNatRecent() {
    try {
      const list = JSON.parse(localStorage.getItem(NAT_KEY) || '[]');
      if (Array.isArray(list) && list.length) return list.slice(0, 5);
    } catch (e) { /* ignore */ }
    return NAT_DEFAULTS.slice();
  }

  function saveNatRecent(code) {
    if (!code) return;
    const label = natLabel(code);
    const next = [{ code: code, label: label }].concat(
      loadNatRecent().filter(function (item) { return item.code !== code; })
    ).slice(0, 5);
    localStorage.setItem(NAT_KEY, JSON.stringify(next));
    renderNatChips();
  }

  function renderNatChips() {
    if (!natChips) return;
    const list = loadNatRecent();
    const active = nationality ? nationality.value : '';
    natChips.innerHTML = list.map(function (item) {
      const activeCls = item.code === active ? ' is-active' : '';
      return '<button type="button" class="pp-nat-chip' + activeCls + '" data-code="' + item.code + '">' +
        (item.label || item.code) + '</button>';
    }).join('');
    natChips.querySelectorAll('.pp-nat-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!nationality) return;
        nationality.value = btn.dataset.code || '';
        saveNatRecent(nationality.value);
      });
    });
  }

  if (nationality) {
    nationality.addEventListener('change', function () {
      saveNatRecent(nationality.value);
    });
  }
  renderNatChips();

  function applySmartSearch() {
    if (!smartInput || !input) return;
    const raw = (smartInput.value || '').trim();
    if (!raw) {
      input.focus();
      return;
    }
    // Lightweight parse: prefer a "to X" destination, else use full text.
    let dest = raw;
    const toMatch = raw.match(/\bto\s+([A-Za-z][A-Za-z\s,'.-]{1,40}?)(?:\s+from|\s+on|\s+in|\s*,|\s*$)/i);
    if (toMatch) dest = toMatch[1].trim();
    input.value = dest;
    if (placeId) placeId.value = '';
    if (hotelId) hotelId.value = '';
    if (countryCode) countryCode.value = '';

    const starMatch = raw.match(/(\d)\s*[- ]?\s*star/i);
    if (starMatch) {
      const star = starMatch[1];
      document.querySelectorAll('#star-rating input[name="stars"]').forEach(function (el) {
        el.checked = el.value === star;
      });
    }

    const months = {
      jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3,
      may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7,
      sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
    };
    const range = raw.match(/\b([A-Za-z]+)\s+(\d{1,2})\s*(?:to|-)\s*(\d{1,2})\b/i);
    if (range && checkin && checkout) {
      const m = months[range[1].toLowerCase()];
      if (m != null) {
        const year = new Date().getFullYear();
        const start = new Date(year, m, parseInt(range[2], 10));
        const end = new Date(year, m, parseInt(range[3], 10));
        if (end <= start) end.setDate(end.getDate() + 1);
        if (start >= new Date(new Date().toDateString())) {
          checkin.value = toIsoLocal(start);
          checkout.value = toIsoLocal(end);
          syncFromDates(false);
        }
      }
    }

    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.focus();
  }

  if (smartGo) smartGo.addEventListener('click', applySmartSearch);
  if (smartInput) {
    smartInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        applySmartSearch();
      }
    });
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    // e.g. 26 Jul 2026
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function nightsBetween(a, b) {
    if (!a || !b) return 1;
    const ms = new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00');
    return Math.max(1, Math.round(ms / 86400000));
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function toIsoLocal(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function addDays(iso, n) {
    const d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + n);
    return toIsoLocal(d);
  }

  function openPicker(el) {
    if (!el) return;
    try {
      if (typeof el.showPicker === 'function') el.showPicker();
      else el.focus();
    } catch (e) {
      el.focus();
    }
  }

  function syncDateDisplay() {
    if (checkinDisplay) checkinDisplay.textContent = fmtDate(checkin && checkin.value) || 'Check-in';
    if (checkoutDisplay) checkoutDisplay.textContent = fmtDate(checkout && checkout.value) || 'Check-out';
  }

  function syncFromDates(forceOneNight) {
    if (syncing || !checkin || !checkout) return;
    syncing = true;
    if (checkin.value) {
      const minOut = addDays(checkin.value, 1);
      checkout.min = minOut;
      // Always keep at least 1 night unless checkout is already after check-in.
      if (forceOneNight || !checkout.value || checkout.value <= checkin.value) {
        checkout.value = minOut;
      }
    }
    if (nights && checkin.value && checkout.value) {
      nights.value = String(Math.max(1, nightsBetween(checkin.value, checkout.value)));
    }
    syncDateDisplay();
    syncing = false;
  }

  function syncFromNights() {
    if (syncing || !nights || !checkin || !checkin.value) return;
    syncing = true;
    const n = Math.max(1, parseInt(nights.value || '1', 10));
    nights.value = String(n);
    checkout.value = addDays(checkin.value, n);
    syncDateDisplay();
    syncing = false;
  }

  if (checkin) {
    checkin.addEventListener('change', function () { syncFromDates(true); });
    checkin.addEventListener('input', function () { syncFromDates(true); });
  }
  if (checkout) {
    checkout.addEventListener('change', function () { syncFromDates(false); });
    checkout.addEventListener('input', function () { syncFromDates(false); });
  }
  if (nights) nights.addEventListener('change', syncFromNights);
  if (checkinDisplay) {
    checkinDisplay.addEventListener('click', function (e) {
      e.preventDefault();
      openPicker(checkin);
    });
  }
  if (checkoutDisplay) {
    checkoutDisplay.addEventListener('click', function (e) {
      e.preventDefault();
      openPicker(checkout);
    });
  }
  // Ensure loaded page always has at least 1 night.
  syncFromDates(true);

  if (input && box) {
    let suggestSeq = 0;
    let suggestLocked = false;
    let suggestAbort = null;

    function closeSuggestions() {
      clearTimeout(timer);
      suggestSeq += 1;
      if (suggestAbort) {
        try { suggestAbort.abort(); } catch (e) { /* ignore */ }
        suggestAbort = null;
      }
      box.hidden = true;
      box.innerHTML = '';
    }

    function pickSuggestion(btn) {
      suggestLocked = true;
      closeSuggestions();
      input.value = btn.dataset.name || '';
      const type = btn.dataset.type || 'place';
      if (type === 'hotel') {
        if (hotelId) hotelId.value = btn.dataset.hotel || '';
        if (placeId) placeId.value = '';
        if (countryCode) countryCode.value = btn.dataset.cc || '';
      } else {
        if (hotelId) hotelId.value = '';
        if (placeId) placeId.value = btn.dataset.place || '';
        if (countryCode) countryCode.value = btn.dataset.cc || '';
      }
      // Keep focus for keyboard users, but do not re-open the list until they type again.
      input.blur();
    }

    input.addEventListener('input', function () {
      // User is typing again — allow fresh suggestions.
      suggestLocked = false;
      if (placeId) placeId.value = '';
      if (hotelId) hotelId.value = '';
      if (countryCode) countryCode.value = '';
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2) {
        closeSuggestions();
        return;
      }
      const seq = ++suggestSeq;
      timer = setTimeout(function () {
        if (suggestAbort) {
          try { suggestAbort.abort(); } catch (e) { /* ignore */ }
        }
        suggestAbort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const nat = (document.getElementById('nationality') || {}).value || '';
        const url = '{% url "places_autocomplete" %}?q=' + encodeURIComponent(q) +
          (nat ? '&nationality=' + encodeURIComponent(nat) : '');
        fetch(url, suggestAbort ? { signal: suggestAbort.signal } : undefined)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            // Ignore stale responses and anything after a selection.
            if (seq !== suggestSeq || suggestLocked) return;
            const results = data.results || [];
            if (!results.length) {
              box.hidden = true;
              box.innerHTML = '';
              return;
            }
            box.innerHTML = results.map(function (p) {
              const type = p.type || 'place';
              const label = type === 'hotel' ? 'Hotel' : 'Destination';
              const name = (p.displayName || '').replace(/"/g, '&quot;');
              const sub = (p.formattedAddress || '').replace(/"/g, '&quot;');
              return `<button type="button" data-type="${type}" data-hotel="${p.hotelId || ''}" data-place="${p.placeId || ''}" data-cc="${p.countryCode || ''}" data-name="${name}"><span class="gp-suggest-type">${label}</span>${p.displayName || ''}<small>${sub}</small></button>`;
            }).join('');
            box.hidden = false;
            box.querySelectorAll('button').forEach(function (btn) {
              // mousedown fires before blur/input races and is more reliable than click.
              btn.addEventListener('mousedown', function (e) {
                e.preventDefault();
                pickSuggestion(btn);
              });
            });
          })
          .catch(function (err) {
            if (err && err.name === 'AbortError') return;
            if (seq !== suggestSeq || suggestLocked) return;
            box.hidden = true;
          });
      }, 400);
    });

    document.addEventListener('click', function (e) {
      if (!box.contains(e.target) && e.target !== input) closeSuggestions();
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSuggestions();
    });
  }

  document.querySelectorAll('.pp-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.pp-tab').forEach(function (t) {
        t.classList.toggle('active', t === tab);
        t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      });
      const key = tab.dataset.tab;
      document.querySelectorAll('.pp-tab-panel').forEach(function (panel) {
        panel.hidden = panel.dataset.panel !== key;
      });
    });
  });

  function loadRecent() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch (e) { return []; }
  }

  function saveRecent(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, 12)));
  }

  function ensureDemoRecent() {
    if (loadRecent().length) return;
    if (localStorage.getItem(STORAGE_KEY + '_seeded')) return;
    const baseIn = (checkin && checkin.value) || new Date().toISOString().slice(0, 10);
    saveRecent([
      {
        destination: 'Dubai, United Arab Emirates',
        hotel: '',
        checkin: baseIn,
        checkout: addDays(baseIn, 4),
        nights: '4',
        adults: '2',
        rooms: '1',
        occupancies: [{ adults: 2 }],
      },
      {
        destination: 'Dubai, United Arab Emirates',
        hotel: 'Rixos Premium Dubai JBR',
        checkin: baseIn,
        checkout: addDays(baseIn, 4),
        nights: '4',
        adults: '2',
        rooms: '1',
        occupancies: [{ adults: 2 }],
      },
      {
        destination: 'Muscat, Oman',
        hotel: '',
        checkin: baseIn,
        checkout: addDays(baseIn, 3),
        nights: '3',
        adults: '2',
        rooms: '1',
        occupancies: [{ adults: 2 }],
      },
    ]);
    localStorage.setItem(STORAGE_KEY + '_seeded', '1');
  }

  function renderRecent() {
    const wrap = document.getElementById('recent-searches');
    const section = document.getElementById('recent-searches-section');
    if (!wrap || !section) return;
    ensureDemoRecent();
    const list = loadRecent();
    if (!list.length) {
      section.hidden = true;
      return;
    }
    section.hidden = false;
    wrap.innerHTML = list.map(function (item, idx) {
      const title = item.hotel || item.destination || 'Recent search';
      const guests = (parseInt(item.adults || 0, 10) || 0) + (parseInt(item.children || 0, 10) || 0) || item.adults || 2;
      const nightsLabel = (item.nights || 1) + ' night' + (String(item.nights || 1) === '1' ? '' : 's');
      const dates = [fmtDate(item.checkin), fmtDate(item.checkout)].filter(Boolean).join(' - ')
        + (item.checkin && item.checkout ? ' (' + nightsLabel + ')' : '');
      return `<article class="pp-recent-card" data-idx="${idx}">
        <button type="button" class="pp-recent-remove" data-idx="${idx}" aria-label="Remove">×</button>
        <h3 title="${title.replace(/"/g, '&quot;')}">${title}</h3>
        <p class="pp-recent-meta">
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c0-3 2.5-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            ${guests} guest${Number(guests) === 1 ? '' : 's'}
          </span>
          <span>${dates}</span>
        </p>
      </article>`;
    }).join('');

    wrap.querySelectorAll('.pp-recent-remove').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const list2 = loadRecent();
        list2.splice(parseInt(btn.dataset.idx, 10), 1);
        saveRecent(list2);
        renderRecent();
      });
    });

    wrap.querySelectorAll('.pp-recent-card').forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.classList.contains('pp-recent-remove')) return;
        const item = loadRecent()[parseInt(card.dataset.idx, 10)];
        if (!item) return;
        if (input) input.value = item.destination || '';
        if (placeId) placeId.value = item.place_id || '';
        if (countryCode) countryCode.value = item.country_code || '';
        if (checkin) checkin.value = item.checkin || checkin.value;
        if (checkout) checkout.value = item.checkout || checkout.value;
        if (nights) nights.value = item.nights || nightsBetween(checkin.value, checkout.value);
        if (window.msPartnerOccupancy && item.occupancies) {
          window.msPartnerOccupancy.setRooms(item.occupancies);
        } else if (occupanciesHidden) {
          occupanciesHidden.value = JSON.stringify(item.occupancies || [{ adults: parseInt(item.adults || 2, 10) }]);
        }
        syncFromDates();
        form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  }

  const track = document.getElementById('recent-searches');
  const prev = document.getElementById('recent-prev');
  const next = document.getElementById('recent-next');
  if (prev && track) prev.addEventListener('click', function () { track.scrollBy({ left: -280, behavior: 'smooth' }); });
  if (next && track) next.addEventListener('click', function () { track.scrollBy({ left: 280, behavior: 'smooth' }); });

  form.addEventListener('submit', function (e) {
    if (!input.value.trim()) {
      e.preventDefault();
      alert('Choose a destination to search.');
      return;
    }
    let childTotal = 0;
    let occ = [{ adults: parseInt((adultsHidden && adultsHidden.value) || '2', 10) }];
    try {
      occ = JSON.parse((occupanciesHidden && occupanciesHidden.value) || '[]');
      occ.forEach(function (r) { childTotal += (r.children || []).length; });
    } catch (err) { childTotal = 0; }
    const list = loadRecent().filter(function (item) {
      return !(item.destination === input.value.trim() && item.checkin === checkin.value && item.checkout === checkout.value);
    });
    list.unshift({
      destination: input.value.trim(),
      hotel: '',
      place_id: placeId ? placeId.value : '',
      country_code: countryCode ? countryCode.value : '',
      checkin: checkin.value,
      checkout: checkout.value,
      nights: nights ? nights.value : String(nightsBetween(checkin.value, checkout.value)),
      adults: adultsHidden ? adultsHidden.value : '2',
      children: childTotal,
      rooms: roomsHidden ? roomsHidden.value : '1',
      occupancies: occ,
    });
    saveRecent(list);
    if (nationality) saveNatRecent(nationality.value);
  });

  renderRecent();
})();
</script>
