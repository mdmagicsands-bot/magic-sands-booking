{% extends "base.html" %}
{% block title %}Guest details | {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="page narrow-page">
  <p class="eyebrow">Checkout</p>
  <h1>Guest details</h1>
  {% if hotel_name %}<p class="meta">{{ hotel_name }} · {{ checkin }} → {{ checkout }}</p>{% endif %}

  <form class="form-panel" method="post" action="{% url 'checkout' %}">
    {% csrf_token %}
    <input type="hidden" name="offer_id" value="{{ offer_id }}">
    <input type="hidden" name="hotel_id" value="{{ hotel_id }}">
    <input type="hidden" name="hotel_name" value="{{ hotel_name }}">
    <input type="hidden" name="checkin" value="{{ checkin }}">
    <input type="hidden" name="checkout" value="{{ checkout }}">
    <input type="hidden" name="adults" value="{{ adults }}">

    <div class="form-row">
      <div class="field">
        <label for="first_name">First name</label>
        <input id="first_name" name="first_name" required>
      </div>
      <div class="field">
        <label for="last_name">Last name</label>
        <input id="last_name" name="last_name" required>
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel">
    </div>
    <button type="submit" class="btn btn-primary">Continue to payment</button>
  </form>
</section>
{% endblock %}
